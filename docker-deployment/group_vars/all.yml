---
# group_vars/all.yml
# Global variables for the brane_deploy role.
# Override any value in your inventory host_vars or on the command line:
#   ansible-playbook site.yml -e "brane_user_home=/home/myuser"

#############################
# ── User & paths ────────────
#############################

# Home directory of the SSH/deploy user on the target VMs.
# Change this to match your remote user (e.g. /home/ubuntu, /home/adam).
brane_user_home: "/home/adam"

#############################
# ── Brane release lock ──────
#############################

# One verified Brane release baseline for every externally downloaded artefact.
# GitHub's mutable `test` tag is constrained by the SHA-256 values below.
brane_release:
  tag: "test"
  published_at: "2026-03-06T15:01:19Z"
  target_commitish: "main"
  assets:
    brane-linux-x86_64:
      url: "https://github.com/BraneFramework/brane/releases/download/test/brane-linux-x86_64"
      sha256: "761597c68bfbdccb745b0e466c9011ff82fbdb4dbf886567dea178cd5f4116c1"
    branectl-linux-x86_64:
      url: "https://github.com/BraneFramework/brane/releases/download/test/branectl-linux-x86_64"
      sha256: "c1f3c7804d258b3afcbf0956ab5bf17a2a66a9dfa280d844fc0418d1373cbe2b"
    branelet-linux-x86_64:
      url: "https://github.com/BraneFramework/brane/releases/download/test/branelet-linux-x86_64"
      sha256: "e57d96f419ee702188f8a3b9aeffc4a02300474e5579202267f27516c128c8d3"
    central-instance-x86_64.tar.gz:
      url: "https://github.com/BraneFramework/brane/releases/download/test/central-instance-x86_64.tar.gz"
      sha256: "6e48ddc466f317fc0979abf9b4c4fc0c1a4f6f3b79f2aea1b476ca03aaf1571a"
    worker-instance-x86_64.tar.gz:
      url: "https://github.com/BraneFramework/brane/releases/download/test/worker-instance-x86_64.tar.gz"
      sha256: "0f02cfc20007b8d4774020d3cfe6e1b7c526b492a1144801bfb877fbbf9b0027"

# Images are loaded from the locked archives and tagged locally for Compose.
brane_image_tag: "{{ brane_release.tag }}"
brane_image_version: "{{ brane_release.tag }}"

brane_central_tarball: "central-instance-x86_64.tar.gz"
brane_central_tarball_sha256: "{{ brane_release.assets[brane_central_tarball].sha256 }}"
brane_worker_tarball: "worker-instance-x86_64.tar.gz"
brane_worker_tarball_sha256: "{{ brane_release.assets[brane_worker_tarball].sha256 }}"

brane_cli_artifacts:
  linux-x86_64:
    url: "{{ brane_release.assets['brane-linux-x86_64'].url }}"
    sha256: "{{ brane_release.assets['brane-linux-x86_64'].sha256 }}"

branectl_artifacts:
  linux-x86_64:
    url: "{{ brane_release.assets['branectl-linux-x86_64'].url }}"
    sha256: "{{ brane_release.assets['branectl-linux-x86_64'].sha256 }}"

branelet_url: "{{ brane_release.assets['branelet-linux-x86_64'].url }}"
branelet_sha256: "{{ brane_release.assets['branelet-linux-x86_64'].sha256 }}"

brane_worker_hostname: "{{ ansible_host }}"

#############################
# ── Smoke test ──────────────
#############################

smoke_test_dest: "{{ brane_central_install_dir }}/target/release/smoke-test"

#############################
# ── Local binary paths ──────
#############################

# branectl installed per-user (no sudo required)
branectl_local_bin: "{{ brane_user_home }}/.local/bin/branectl"

# brane CLI installed per-user (no sudo required)
brane_cli_path: "{{ brane_user_home }}/.local/bin/brane"

#############################
# ── Install directories ─────
#############################

brane_central_install_dir: "{{ brane_user_home }}/brane-central"
brane_install_dir: "{{ brane_user_home }}/brane-central"
brane_worker_install_dir: "{{ brane_user_home }}/brane-worker"
brane_proxy_install_dir: "{{ brane_user_home }}/brane-proxy"

#############################
# ── Certificate directories ─
#############################

central_cert_dir: "{{ brane_central_install_dir }}/config/certs"
worker_cert_dir: "{{ brane_worker_install_dir }}/config/certs"
proxy_cert_dir: "{{ brane_proxy_install_dir }}/config/certs"
cert_artifact_dir: "artifacts/certs"

#############################
# ── Brane service endpoints ─
#############################

brane_hub_api: >-
  http://{{ hostvars[groups['central'][0]].ansible_host }}:30051

brane_registry_url: >-
  http://{{ hostvars[groups['central'][0]].ansible_host }}:50051

brane_driver_url: >-
  http://{{ hostvars[groups['central'][0]].ansible_host }}:50053

#############################
# ── Deployment defaults ─────
#############################

brane_policy_secrets:
  - policy_deliberation_secret.json
  - policy_expert_secret.json

# Set to true to wipe all Brane data on the target nodes during cleanup
brane_full_cleanup: false

