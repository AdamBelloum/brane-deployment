---
# group_vars/all.yml
# Global variables for the brane_deploy role.
# Override any value in your inventory host_vars or on the command line:
#   ansible-playbook site.yml -e "brane_user_home=/home/myuser"

#############################
# ── User & paths ────────────
#############################

# Home directory of the SSH/deploy user on the target VMs.
# Change this to match your remote user (e.g. /home/ubuntu, /home/adam).
brane_user_home: "/home/ubuntu"

#############################
# ── Brane image version ─────
#############################

brane_image_tag: "3.0.0-nightly_fdbbd6c2"
brane_image_version: "3.0.0-nightly_fdbbd6c2"

brane_worker_hostname: "{{ ansible_host }}"

#############################
# ── Smoke test ──────────────
#############################

smoke_test_dest: "{{ brane_central_install_dir }}/target/release/smoke-test"
smoke_test_base_url: "https://raw.githubusercontent.com/AdamBelloum/brane-deployment/main/scripts/smoke-test"

#############################
# ── Compose file URLs ───────
#############################

# Docker Compose template for worker nodes
brane_worker_compose_url: >-
  https://raw.githubusercontent.com/AdamBelloum/brane-deployment/refs/heads/main/scripts/templates/worker-compose.yml

# Docker Compose template for the central hub
brane_central_compose_url: >-
  https://raw.githubusercontent.com/AdamBelloum/brane-deployment/refs/heads/main/scripts/templates/central-compose.yml

#############################
# ── Base release URL ────────
#############################

_brane_release_base: "https://github.com/BraneFramework/brane/releases/download/nightly"

#############################
# ── Binary download URLs ────
#############################

# Active: test release (pinned for stability during development)
# Switch to the nightly or arch-specific URLs below when ready.
branectl_url: "https://github.com/BraneFramework/brane/releases/download/test/branectl-linux-x86_64"
brane_cli_url: "https://github.com/BraneFramework/brane/releases/download/test/brane-linux-x86_64"

# Nightly (uncomment to use):
# branectl_url: "https://github.com/BraneFramework/brane/releases/download/nightly/branectl-linux-x86_64"
# brane_cli_url: "https://github.com/BraneFramework/brane/releases/download/nightly/brane-linux-x86_64"

# Architecture-aware (uncomment to use):
# branectl_url: "https://github.com/BraneFramework/brane/releases/download/nightly/branectl-{{ ansible_system | lower }}-{{ ansible_architecture }}"
# brane_cli_url: "https://github.com/BraneFramework/brane/releases/download/nightly/brane-{{ ansible_system | lower }}-{{ ansible_architecture }}"

#############################
# ── Local binary paths ──────
#############################

# branectl installed per-user (no sudo required)
branectl_local_bin: "{{ brane_user_home }}/.local/bin/branectl"

# brane CLI installed per-user (no sudo required)
brane_cli_path: "{{ brane_user_home }}/.local/bin/brane"

#############################
# ── Install directories ─────
#############################

brane_central_install_dir: "{{ brane_user_home }}/brane-central"
brane_install_dir: "{{ brane_user_home }}/brane-central"
brane_worker_install_dir: "{{ brane_user_home }}/brane-worker"
brane_proxy_install_dir: "{{ brane_user_home }}/brane-proxy"

#############################
# ── Certificate directories ─
#############################

central_cert_dir: "{{ brane_central_install_dir }}/config/certs"
worker_cert_dir: "{{ brane_worker_install_dir }}/config/certs"
proxy_cert_dir: "{{ brane_proxy_install_dir }}/config/certs"
cert_artifact_dir: "artifacts/certs"

#############################
# ── Brane service endpoints ─
#############################

brane_hub_api: >-
  http://{{ hostvars[groups['central'][0]].ansible_host }}:30051

brane_registry_url: >-
  http://{{ hostvars[groups['central'][0]].ansible_host }}:50051

brane_driver_url: >-
  http://{{ hostvars[groups['central'][0]].ansible_host }}:50053

#############################
# ── Deployment defaults ─────
#############################

brane_policy_secrets:
  - policy_deliberation_secret.json
  - policy_expert_secret.json

# Set to true to wipe all Brane data on the target nodes during cleanup
brane_full_cleanup: false

