---
# roles/brane/defaults/main.yml
# Defaults — all overridable via group_vars/all.yml or host_vars.

############################
# Brane release baseline
############################

# The deployment-level checksum-locked release manifest is defined in
# docker-deployment/group_vars/all.yml.
brane_image_tag: "test"
brane_image_version: "test"

############################
# Tarball names
############################

brane_worker_tarball: "worker-instance-x86_64.tar.gz"
brane_central_tarball: "central-instance-x86_64.tar.gz"

############################
# Install directories
############################

brane_user_home: "/home/adam"
brane_worker_install_dir: "{{ brane_user_home }}/brane-worker"
brane_central_install_dir: "{{ brane_user_home }}/brane-central"

############################
# branectl binary
############################

branectl_local_bin: "{{ brane_user_home }}/.local/bin/branectl"

############################
# Certificate staging
############################

cert_artifact_dir: "artifacts/certs"

############################
# Central hostname
############################

# Central node hostname used in node config
brane_central_internal_hostname: "brane-central.internal"

############################
# Central service names & ports
############################
brane_drv_name: "brane-drv"
brane_drv_port: 50053
brane_prx_name: "brane-prx"
brane_api_name: "brane-api"
brane_api_port: 50051
brane_plr_name: "brane-plr"
