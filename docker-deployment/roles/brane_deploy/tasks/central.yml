---
# roles/brane_deploy/tasks/central.yml
# Prepare the Brane central node: dirs, tarball, config, ACLs, images, compose, certs.
# NOTE: cert exchange (worker CA → central, central CA → workers) is handled by certs.yml

# ── Directories ────────────────────────────────────────────────────────────────
- name: "Central | Create base install directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    recurse: true
    mode: "0755"
  loop:
    - "{{ brane_central_install_dir }}/config/certs"
    - "{{ brane_central_install_dir }}/data"
    - "{{ brane_central_install_dir }}/packages"
    - "{{ brane_central_install_dir }}/results"
    - "{{ brane_central_install_dir }}/target/release"
    - "{{ brane_central_install_dir }}/target/release/smoke-test/smoke-test-package"
  become: false
  tags: [central]

- name: "Central | Create per-worker cert dirs (from inventory)"
  ansible.builtin.file:
    path: "{{ brane_central_install_dir }}/config/certs/{{ hostvars[item].location_id }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    recurse: true
    mode: "0755"
  loop: "{{ groups['workers'] }}"
  become: false
  tags: [central]

- name: "Central | Grant container UID 1000 access to install dir"
  ansible.posix.acl:
    path: "{{ brane_central_install_dir }}"
    entity: "1000"
    etype: user
    permissions: rwx
    state: present
  become: false
  tags: [central]

- name: "Central | Set default ACL (inherit for new files/dirs)"
  ansible.posix.acl:
    path: "{{ brane_central_install_dir }}"
    entity: "1000"
    etype: user
    permissions: rwx
    default: true
    state: present
  become: false
  tags: [central]

- name: "Central | Grant container UID 1000 rwx on packages dir"
  ansible.posix.acl:
    path: "{{ brane_central_install_dir }}/packages"
    entity: "1000"
    etype: user
    permissions: rwx
    state: present
  become: false
  tags: [central]

- name: "Central | Set default ACL on packages dir (inherit for new subdirs)"
  ansible.posix.acl:
    path: "{{ brane_central_install_dir }}/packages"
    entity: "1000"
    etype: user
    permissions: rwx
    default: true
    state: present
  become: false
  tags: [central]

# ── Tarball ────────────────────────────────────────────────────────────────────
- name: "Central | Download central release tarball"
  ansible.builtin.get_url:
    url: "{{ brane_release.assets[brane_central_tarball].url }}"
    checksum: "sha256:{{ brane_central_tarball_sha256 }}"
    dest: "/tmp/{{ brane_central_tarball }}"
    mode: "0644"
  become: false
  tags: [central]

- name: "Central | Extract tarball into target/release"
  ansible.builtin.unarchive:
    src: "/tmp/{{ brane_central_tarball }}"
    dest: "{{ brane_central_install_dir }}/target/release"
    remote_src: true
    extra_opts: ["--strip-components=1"]
  become: false
  tags: [central]

# ── Compose file ───────────────────────────────────────────────────────────────
- name: "Central | Copy central-compose.yml from the deployment checkout"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/templates/central-compose.yml"
    dest: "{{ brane_central_install_dir }}/docker-compose.yml"
    mode: "0644"
    owner: "{{ ansible_user }}"
    force: true
  become: false
  tags: [central]

# ── .env for docker-compose ────────────────────────────────────────────────────
- name: "Central | Write .env for docker-compose"
  ansible.builtin.copy:
    dest: "{{ brane_central_install_dir }}/.env"
    owner: "{{ ansible_user }}"
    mode: "0640"
    content: |
      DRV_NAME={{ brane_drv_name }}
      DRV_PORT={{ brane_drv_port }}
      PRX_NAME={{ brane_prx_name }}
      API_NAME={{ brane_api_name }}
      API_PORT={{ brane_api_port }}
      PLR_NAME={{ brane_plr_name }}
      BRANE_VERSION={{ brane_image_tag }}
      NODE_CONFIG_PATH={{ brane_central_install_dir }}/node.yml
      INFRA={{ brane_central_install_dir }}/config/infra.yml
      PROXY={{ brane_central_install_dir }}/config/proxy.yml
      CERTS={{ brane_central_install_dir }}/config/certs
      DATA={{ brane_central_install_dir }}/data
      PACKAGES={{ brane_central_install_dir }}/packages
      RESULTS={{ brane_central_install_dir }}/results
      BRANE_CENTRAL_IP={{ ansible_host }}
      WORKER_A_IP={{ hostvars[groups['workers'][0]]['ansible_host'] }}
      WORKER_B_IP={{ hostvars[groups['workers'][1]]['ansible_host'] }}
  become: false
  tags: [central]

# ── Config generation ──────────────────────────────────────────────────────────
- name: "Central | Generate proxy config"
  ansible.builtin.command:
    cmd: >
      {{ branectl_local_bin }} generate proxy
      -f -p {{ brane_central_install_dir }}/config/proxy.yml
    chdir: "{{ brane_central_install_dir }}"
  changed_when: true
  become: false
  tags: [central]

- name: "Central | Generate infra config (register all workers)"
  ansible.builtin.command:
    cmd: >
      {{ branectl_local_bin }} generate infra -f
      -p {{ brane_central_install_dir }}/config/infra.yml
      {% for w in groups['workers'] %}
      {{ hostvars[w].location_id }}:{{ hostvars[w].brane_hostname }}
      {% endfor %}
    chdir: "{{ brane_central_install_dir }}"
  changed_when: true
  become: false
  tags: [central]

- name: "Central | Generate node config"
  ansible.builtin.command:
    cmd: >
      {{ branectl_local_bin }} generate node -f
      -H {{ brane_central_internal_hostname }}:{{ ansible_host }}
      {% for w in groups['workers'] %}
      -H {{ hostvars[w].brane_hostname }}:{{ hostvars[w].ansible_host }}
      {% endfor %}
      central {{ brane_central_internal_hostname }}
    chdir: "{{ brane_central_install_dir }}"
  changed_when: true
  become: false
  tags: [central]

# ── Certificate generation (central's own certs) ──────────────────────────────

- name: "Central | Generate server certs"
  ansible.builtin.command:
    cmd: >
      {{ branectl_local_bin }} generate certs -f
      -p {{ brane_central_install_dir }}/config/certs
      server central
      -H {{ ansible_host }}
    chdir: "{{ brane_central_install_dir }}"
  changed_when: true
  become: false
  tags: [central]

# ── Docker images ──────────────────────────────────────────────────────────────

- name: "Central | Load and tag Docker images"
  ansible.builtin.shell: |
    SHA=$(docker load -i {{ brane_central_install_dir }}/target/release/{{ item.tar }} | awk '{print $NF}')
    docker tag $SHA {{ item.image }}:{{ brane_image_tag }}
  loop:
    #- { tar: "aux-kafka.tar",      image: "aux-kafka" }
    #- { tar: "aux-scylla.tar",     image: "aux-scylla" }
    #- { tar: "aux-zookeeper.tar",  image: "aux-zookeeper" }
    - { tar: "brane-api.tar",      image: "brane-api" }
    - { tar: "brane-drv.tar",      image: "brane-drv" }
    - { tar: "brane-plr.tar",      image: "brane-plr" }
    - { tar: "brane-prx.tar",      image: "brane-prx" }
  changed_when: true
  become: false
  tags: [central]

# ── smoke test  ──────────────────────────────────────────────────────────────
- name: Install Brane smoke test on central
  block:
    - name: Ensure smoke test directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ smoke_test_dest }}"
        - "{{ smoke_test_dest }}/smoke-test-package"

    - name: Copy run-smoke-test.sh from the deployment checkout
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/smoke-test/run-smoke-test.sh"
        dest: "{{ smoke_test_dest }}/run-smoke-test.sh"
        mode: '0755'

    - name: Copy smoke-test-package files from the deployment checkout
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/smoke-test/smoke-test-package/{{ item }}"
        dest: "{{ smoke_test_dest }}/smoke-test-package/{{ item }}"
        mode: '0644'
      loop:
        - container.yml
        - smoke_test.sh
        - worker-a.bs
        - worker-b.bs
