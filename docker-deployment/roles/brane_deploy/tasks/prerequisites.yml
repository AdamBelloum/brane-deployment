---
# roles/brane_deploy/tasks/prerequisites.yml
# Install Docker, dependencies, and libssl1.1 on all nodes.

- name: "Prerequisites | Remove conflicting upstream Docker plugin packages"
  ansible.builtin.apt:
    name:
      - docker-buildx-plugin
      - docker-compose-plugin
    state: absent
  ignore_errors: true
  become: true
  tags: [prerequisites]

- name: "Prerequisites | Fix any broken apt state"
  ansible.builtin.command: apt-get -f install -y
  changed_when: false
  become: true
  tags: [prerequisites]

- name: "Prerequisites | Install required packages"
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
      - curl
      - wget
      - jq
      - ca-certificates
      - acl                  # required for ansible.posix.acl module
    state: present
    update_cache: true
  become: true
  tags: [prerequisites]

- name: "Prerequisites | Enable and start Docker"
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  become: true
  tags: [prerequisites]

- name: "Prerequisites | Add {{ ansible_user }} to docker group"
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
  become: true
  tags: [prerequisites]

- name: "Prerequisites | Add Bullseye repo for libssl1.1 (Debian 13 workaround)"
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/bullseye-libssl.list
    content: "deb http://deb.debian.org/debian bullseye main\n"
    mode: "0644"
  become: true
  tags: [prerequisites]

- name: "Prerequisites | Update apt cache after adding Bullseye repo"
  ansible.builtin.apt:
    update_cache: true
  become: true
  tags: [prerequisites]

- name: "Prerequisites | Install libssl1.1 from Bullseye"
  ansible.builtin.apt:
    name: libssl1.1
    state: present
    default_release: bullseye
  become: true
  tags: [prerequisites]

- name: "Prerequisites | Remove Bullseye repo after libssl1.1 install"
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/bullseye-libssl.list
    state: absent
  become: true
  tags: [prerequisites]

- name: "Prerequisites | Refresh apt cache after removing Bullseye repo"
  ansible.builtin.apt:
    update_cache: true
  become: true
  tags: [prerequisites]

# These can stay non-root (operate in /home/adam):

- name: "Prerequisites | Ensure ~/.local/bin exists for {{ ansible_user }}"
  become: false
  ansible.builtin.file:
    path: "{{ brane_user_home }}/.local/bin"
    state: directory
    owner: "{{ ansible_user }}"
    mode: "0755"
  tags: [prerequisites]

- name: "Prerequisites | Ensure ~/.local/bin is in PATH for {{ ansible_user }}"
  ansible.builtin.lineinfile:
    path: "{{ brane_user_home }}/.bashrc"
    line: 'export PATH="$HOME/.local/bin:$PATH"'
    regexp: '\.local/bin'
    state: present
    create: true
    owner: "{{ ansible_user }}"
    mode: "0644"
  tags: [prerequisites]
