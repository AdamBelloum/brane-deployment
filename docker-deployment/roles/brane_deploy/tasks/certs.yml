---
# roles/brane_deploy/tasks/certs.yml
# 1. Ensure central can SSH into workers
# 2. Exchange certificates between workers and central

# ── SSH trust: central → workers ───────────────────────────────────────────────

- name: "Certs | Generate SSH keypair on central if not present"
  ansible.builtin.command:
    cmd: ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519
    creates: ~/.ssh/id_ed25519
  when: inventory_hostname in groups['central']
  become: false
  tags: [certs]

- name: "Certs | Fetch central public key"
  ansible.builtin.slurp:
    src: ~/.ssh/id_ed25519.pub
  register: central_pubkey
  when: inventory_hostname in groups['central']
  become: false
  tags: [certs]

- name: "Certs | Authorize central key on workers"
  ansible.posix.authorized_key:
    user: "{{ ansible_user }}"
    key: "{{ hostvars[groups['central'][0]]['central_pubkey']['content'] | b64decode }}"
    state: present
  when: inventory_hostname in groups['workers']
  become: false
  tags: [certs]

# ── Ensure destination directories exist ──────────────────────────────────────

- name: "Certs | Ensure central/certs/<location_id> dir exists on central"
  ansible.builtin.file:
    path: "{{ brane_central_install_dir }}/config/certs/{{ location_id }}"
    state: directory
    mode: "0755"
  delegate_to: "{{ groups['central'][0] }}"
  when: inventory_hostname in groups['workers']
  become: false
  tags: [certs]

- name: "Certs | Ensure config/certs/central dir exists on workers"
  ansible.builtin.file:
    path: "{{ brane_worker_install_dir }}/config/certs/central"
    state: directory
    mode: "0755"
  when: inventory_hostname in groups['workers']
  become: false
  tags: [certs]

# ── Certificate exchange ───────────────────────────────────────────────────────

- name: "Certs | Copy worker CA to central"
  ansible.builtin.command: >
    scp -o StrictHostKeyChecking=accept-new
    {{ ansible_user }}@{{ hostvars[inventory_hostname]['ansible_host'] }}:{{ brane_worker_install_dir }}/config/certs/ca.pem
    {{ brane_central_install_dir }}/config/certs/{{ location_id }}/ca.pem
  delegate_to: "{{ groups['central'][0] }}"
  when: inventory_hostname in groups['workers']
  become: false
  tags: [certs]

- name: "Certs | Copy central CA to worker"
  ansible.builtin.command: >
    scp -o StrictHostKeyChecking=accept-new
    {{ ansible_user }}@{{ hostvars[groups['central'][0]]['ansible_host'] }}:{{ brane_central_install_dir }}/config/certs/ca.pem
    {{ brane_worker_install_dir }}/config/certs/central/ca.pem
  delegate_to: "{{ inventory_hostname }}"
  when: inventory_hostname in groups['workers']
  become: false
  tags: [certs]

