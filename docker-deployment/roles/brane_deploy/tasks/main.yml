---
# roles/brane_deploy/tasks/main.yml
# Entry point — includes task files based on active tags.

- name: "Install OS prerequisites"
  import_tasks: prerequisites.yml
  tags: [prerequisites]

- name: "Install branectl"
  import_tasks: branectl.yml
  tags: [branectl]

- name: "Prepare worker node"
  import_tasks: worker.yml
  when: inventory_hostname in groups['workers']
  tags: [worker]

- name: "Generate and distribute certificates"
  import_tasks: certs.yml
  when: inventory_hostname in groups['central']
  tags: [certs]

- name: "Prepare central node"
  import_tasks: central.yml
  when: inventory_hostname in groups['central']
  tags: [central]

- name: "Start Brane services"
  import_tasks: start.yml
  tags: [start]

- name: "Run smoke test"
  import_tasks: smoke_test.yml
  when: inventory_hostname in groups['central']
  tags: [smoke]

