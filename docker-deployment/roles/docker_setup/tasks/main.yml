---
- name: Remove conflicting old docker packages
  ansible.builtin.apt:
    name:
      - docker-buildx
      - docker.io
      - containerd
      - docker-cli
    state: absent
    purge: yes

- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - wget
    state: present
    update_cache: yes

- name: Ensure keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: true

- name: Add Docker Repository
  ansible.builtin.apt_repository:
    #repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Install Docker Engine and Compose Plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Ensure Docker engine daemon is operational
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: yes

- name: Associate user permissions with Docker socket execution group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes

- name: Reset host SSH session context to force register group mutations
  ansible.builtin.meta: reset_connection

- name: Ensure Docker temporary directory exists
  ansible.builtin.file:
    path: /var/lib/docker/tmp
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Restart Docker to apply temporary directory fix
  ansible.builtin.systemd:
    name: docker
    state: restarted
