name: CI

# This CI validates the quality of the toolbox itself (scripts, YAML syntax,
# Python code). It does NOT deploy Brane. Deployment is always triggered
# manually by an admin who clones this repo and runs the Ansible playbook
# against their own infrastructure.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  # ────────────────────────────────────────────────
  # 1. YAML syntax check (docker-deployment/)
  #    Only validates that YAML files are well-formed.
  #    Does NOT run ansible-lint — that would require
  #    a real inventory and live SSH targets.
  # ────────────────────────────────────────────────
  yaml-lint:
    name: YAML syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Check YAML syntax in docker-deployment/
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 160}, truthy: disable}}" \
            docker-deployment/

  # ────────────────────────────────────────────────
  # 2. Shell script lint (scripts/)
  #    Catches common bash bugs without executing anything.
  # ────────────────────────────────────────────────
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck on all shell scripts
        run: |
          find scripts/ docker-deployment/ -name "*.sh" -print0 \
            | xargs -0 shellcheck --severity=warning

  # ────────────────────────────────────────────────
  # 3. Python syntax check (frontend/)
  #    Verifies the Streamlit app compiles cleanly.
  # ────────────────────────────────────────────────
  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        run: pip install -r frontend/requirements.txt

      - name: Install ruff
        run: pip install ruff

      - name: Check Python syntax (compile all .py files)
        run: python -m compileall frontend/

      - name: Run ruff linter
        run: ruff check frontend/ --select E,F,W --ignore E501

