{{- if .Values.centralHub.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brane-central
  labels:
    app: brane-central
spec:
  replicas: {{ .Values.centralHub.replicaCount }}
  selector:
    matchLabels:
      app: brane-central
  template:
    metadata:
      labels:
        app: brane-central
    spec:
      nodeSelector:
        brane.role: central
      containers:
        - name: central-engine
          image: "{{ .Values.centralHub.image.repository }}:{{ .Values.centralHub.image.tag }}"
          ports:
            - containerPort: 50051
              name: grpc-api
          env:
            - name: BRANE_LOCATION_ID
              value: "central-hub"
            - name: BRANE_HOSTNAME
              value: {{ .Values.global.centralHost | quote }}
          volumeMounts:
            - name: certs-volume
              mountPath: /brane/certs
              readOnly: true
            - name: central-data
              mountPath: /brane/data
      volumes:
        - name: certs-volume
          secret:
            secretName: brane-cluster-certs
        - name: central-data
          persistentVolumeClaim:
            claimName: brane-central-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: brane-central-service
spec:
  type: NodePort
  selector:
    app: brane-central
  ports:
    - protocol: TCP
      port: 50051
      targetPort: 50051
      nodePort: 30051
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: brane-central-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.centralHub.storageSize }}
{{- end }}
